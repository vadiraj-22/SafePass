<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M256 32 L448 96 V240 C448 356 366 444 256 480 C146 444 64 356 64 240 V96 L256 32 Z" 
        fill="#070a0e" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Shield Circuit Border -->
  <path d="M256 60 L420 115 V235 C420 338 348 418 256 450 C164 418 92 338 92 235 V115 L256 60 Z" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="6" 
        stroke-dasharray="12 6"
        opacity="0.6" />

  <!-- Central Padlock Shackle -->
  <path d="M192 210 V160 C192 125 220 96 256 96 C292 96 320 125 320 160 V210" 
        fill="none" 
        stroke="url(#lockGrad)" 
        stroke-width="28" 
        stroke-linecap="round" />

  <!-- Central Padlock Body -->
  <path d="M160 210 H352 C365.255 210 376 220.745 376 234 V350 C376 363.255 365.255 374 352 374 H160 C146.745 374 136 363.255 136 350 V234 C136 220.745 146.745 210 160 210 Z" 
        fill="url(#lockGrad)" 
        filter="url(#glow)" />

  <!-- Keyhole -->
  <circle cx="256" cy="275" r="18" fill="#04120a" />
  <polygon points="246,275 266,275 270,325 242,325" fill="#04120a" />
</svg>
